name: Crear instaladores

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Instaladores de Windows
    runs-on: windows-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias
        run: npm ci

      - name: Crear instalador EXE (NSIS)
        run: npm run build:windows

      - name: Guardar instaladores
        uses: actions/upload-artifact@v4
        with:
          name: NeoApp-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  android:
    name: APK para tabletas Android
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Instalar plataforma Android y NDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"

      - name: Configurar NDK
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Preparar Rust para Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar el proyecto Android
        run: npm run init:android

      - name: Crear APK de prueba
        run: npm run build:android:apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: NeoApp-Android-APK
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
